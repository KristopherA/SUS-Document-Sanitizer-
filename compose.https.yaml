services:
  tls-proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      sanitizer:
        condition: service_healthy
    environment:
      SANITIZER_HOSTNAME: "${SANITIZER_HOSTNAME:-sanitizer.example.org}"
    ports:
      - "${SANITIZER_HTTP_PORT:-80}:80"
      - "${SANITIZER_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/templates/sanitizer.conf.template:/etc/nginx/templates/sanitizer.conf.template:ro
      - ./certs/fullchain.pem:/etc/nginx/tls/fullchain.pem:ro
      - ./certs/privkey.pem:/etc/nginx/tls/privkey.pem:ro
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:size=1m,nosuid,nodev
      - /var/cache/nginx:size=32m,nosuid,nodev
      - /var/run:size=2m,nosuid,nodev
      - /tmp:size=16m,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    networks:
      - sanitizer_net
