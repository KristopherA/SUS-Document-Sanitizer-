services:
  sanitizer:
    build:
      context: .
    image: generic-document-sanitizer:local
    restart: unless-stopped
    depends_on:
      clamav:
        condition: service_healthy
    environment:
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      MAX_UPLOAD_BYTES: "52428800"
      MAX_REQUEST_BYTES: "67108864"
      MAX_OUTPUT_BYTES: "209715200"
      MAX_PDF_INSPECTION_BYTES: "67108864"
      MAX_FORM_MEMORY_BYTES: "500000"
      MAX_FORM_PARTS: "4"
      PROCESS_TIMEOUT_SECONDS: "120"
      TRUSTED_HOSTS: "${SANITIZER_HOSTNAME:-sanitizer.example.org},localhost,127.0.0.1"
    read_only: true
    tmpfs:
      - /tmp:size=768m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    networks:
      - processing_net

  tls-proxy:
    image: nginx:1.30.4-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
    restart: unless-stopped
    depends_on:
      sanitizer:
        condition: service_healthy
    environment:
      SANITIZER_HOSTNAME: "${SANITIZER_HOSTNAME:-sanitizer.example.org}"
      SANITIZER_UPLOAD_RATE: "${SANITIZER_UPLOAD_RATE:-2r/m}"
      SANITIZER_UPLOAD_BURST: "${SANITIZER_UPLOAD_BURST:-2}"
    ports:
      - "${SANITIZER_BIND_ADDRESS:-0.0.0.0}:${SANITIZER_HTTP_PORT:-80}:8080"
      - "${SANITIZER_BIND_ADDRESS:-0.0.0.0}:${SANITIZER_HTTPS_PORT:-443}:8443"
    volumes:
      - ./nginx/templates/sanitizer.conf.template:/etc/nginx/templates/sanitizer.conf.template:ro
      - ./certs/fullchain.pem:/etc/nginx/tls/fullchain.pem:ro
      - ./certs/privkey.pem:/etc/nginx/tls/privkey.pem:ro
    read_only: true
    user: "101:101"
    tmpfs:
      - /etc/nginx/conf.d:size=1m,uid=101,gid=101,mode=0750,nosuid,nodev,noexec
      - /var/cache/nginx:size=64m,uid=101,gid=101,mode=0750,nosuid,nodev,noexec
      - /var/run:size=2m,uid=101,gid=101,mode=0750,nosuid,nodev,noexec
      - /tmp:size=16m,uid=101,gid=101,mode=0700,nosuid,nodev,noexec
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    networks:
      - processing_net
      - frontend_net

  clamav:
    build:
      context: .
      dockerfile: Dockerfile.clamav
    image: generic-document-sanitizer-clamav:local
    restart: unless-stopped
    expose:
      - "3310"
    volumes:
      - clamav_signatures:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 120s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    networks:
      - processing_net
      - signature_egress

volumes:
  clamav_signatures:

networks:
  processing_net:
    internal: true
  signature_egress:
  frontend_net:
