services:
  sanitizer:
    build:
      context: .
    image: generic-document-sanitizer:local
    restart: unless-stopped
    depends_on:
      clamav:
        condition: service_healthy
    ports:
      - "${SANITIZER_PORT:-8080}:8080"
    environment:
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      MAX_UPLOAD_BYTES: "52428800"
      PROCESS_TIMEOUT_SECONDS: "120"
    read_only: true
    tmpfs:
      - /tmp:size=768m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    networks:
      - sanitizer_net

  clamav:
    image: clamav/clamav:1.5.4_base-debian13-slim
    restart: unless-stopped
    expose:
      - "3310"
    environment:
      CLAMD_CONF_StreamMaxLength: "100M"
      CLAMD_CONF_MaxScanSize: "500M"
    volumes:
      - clamav_signatures:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 120s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    networks:
      - sanitizer_net

volumes:
  clamav_signatures:

networks:
  sanitizer_net:
